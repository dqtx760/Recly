<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8">
<title>摄像头预览</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* 预览窗只用于录制时看自己：它不进入录制画面，成片里的摄像头在编辑器里排版。 */
  .bubble { -webkit-app-region: drag; position: absolute; inset: 10px; border-radius: 50%; overflow: hidden; background: #1b1c20; box-shadow: 0 0 0 3px #fff, 0 8px 22px rgba(0, 0, 0, 0.35); }
  img { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
</style>
<body>
  <div class="bubble"><img id="preview" alt=""></div>
  <script>
    'use strict';
    const { ipcRenderer } = require('electron');
    const preview = document.getElementById('preview');
    const NO_FRAME_TIMEOUT_MS = 8000;
    let request = null;
    let generation = 0;
    let frameTimer = null;
    let frameConfirmed = false;
    let pendingFrame = null;

    function report(status, error = null, message = '') {
      if (!request) return;
      ipcRenderer.send('camera:status', {
        requestId: request.requestId,
        deviceId: request.deviceId || null,
        status, error, message,
      });
    }

    function cleanup() {
      if (frameTimer !== null) clearTimeout(frameTimer);
      frameTimer = null;
      pendingFrame = null;
      preview.onload = null;
      preview.onerror = null;
      preview.removeAttribute('src');
    }

    function fail(error, message) {
      generation += 1;
      cleanup();
      frameConfirmed = false;
      report('error', error, message);
    }

    function armTimeout() {
      if (frameTimer !== null) clearTimeout(frameTimer);
      frameTimer = setTimeout(() => {
        fail(frameConfirmed ? 'frame_stalled' : 'no_frame', '摄像头未能持续提供新画面');
      }, NO_FRAME_TIMEOUT_MS);
    }

    function displayFrame(dataUrl) {
      const ownGeneration = generation;
      preview.onload = () => {
        if (ownGeneration !== generation) return;
        if (!frameConfirmed) {
          frameConfirmed = true;
          report('ready');
        }
        armTimeout();
        const next = pendingFrame;
        pendingFrame = null;
        preview.onload = null;
        if (next) displayFrame(next);
      };
      preview.onerror = () => {
        if (ownGeneration === generation) fail('invalid_frame', '摄像头预览画面无法显示');
      };
      preview.src = dataUrl;
    }

    ipcRenderer.on('camera:device', (event, nextRequest) => {
      generation += 1;
      cleanup();
      request = nextRequest;
      frameConfirmed = false;
      report('checking');
      armTimeout();
    });
    ipcRenderer.on('camera:frame', (event, frame) => {
      if (!request || !frame || frame.requestId !== request.requestId || typeof frame.dataUrl !== 'string'
        || !frame.dataUrl.startsWith('data:image/jpeg;base64,')) return;
      if (preview.onload) pendingFrame = frame.dataUrl;
      else displayFrame(frame.dataUrl);
    });
    window.addEventListener('beforeunload', () => {
      generation += 1;
      cleanup();
      request = null;
    });
  </script>
</body>
</html>
