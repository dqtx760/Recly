<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Recly · Windows 录屏与剪辑</title>
  <desc id="desc">一款 Windows 录屏与剪辑工具，支持自动运镜跟随操作，从录制到视频导出。</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21134e"/>
      <stop offset="1" stop-color="#100a2b"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efff61"/>
      <stop offset="1" stop-color="#baff00"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#surface)"/>
  <path d="M48 40h58" stroke="#d6ff27" stroke-width="5" stroke-linecap="round"/>
  <text x="48" y="82" fill="#d6ff27" font-family="Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700" letter-spacing="2">WINDOWS SCREEN RECORDER</text>
  <text x="48" y="160" fill="#fff" font-family="Segoe UI, PingFang SC, sans-serif" font-size="68" font-weight="750">Recly</text>
  <text x="48" y="208" fill="#fff" font-family="Segoe UI, PingFang SC, sans-serif" font-size="30" font-weight="650">录下操作，自动跟随，剪好就导出</text>
  <text x="48" y="254" fill="#c9c3dc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="23">录屏 · 自动运镜 · 时间线剪辑 · MP4 / M4A</text>

